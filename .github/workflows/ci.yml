name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces

      - name: Test
        run: npm test --workspaces

      # packages/core skal kunne koere i baade Node og Hermes. Uden denne
      # kontrol kan en enkelt import stille braekke React Native-appen, og
      # tsconfig alene fanger det ikke for runtime-moduler.
      - name: Platform-uafhaengighed
        run: |
          if grep -rE "from '(react|react-native|fs|path|http|https|os|crypto)'" packages/core/src; then
            echo "::error::packages/core importerer et platform-specifikt modul"
            exit 1
          fi
          echo "ingen platform-afhaengigheder"

      # Kernen skal forblive fri for runtime-afhaengigheder.
      - name: Ingen runtime-dependencies i core
        run: |
          deps=$(node -p "JSON.stringify(require('./packages/core/package.json').dependencies || {})")
          if [ "$deps" != "{}" ]; then
            echo "::error::packages/core har runtime-dependencies: $deps"
            exit 1
          fi
          echo "ingen runtime-dependencies"
