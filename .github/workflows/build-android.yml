name: Byg Android-APK

# Kun manuelt. Et EAS-build koster byggetid, saa det maa ikke fyre af ved
# hvert push — det skal vaere en beslutning, ikke en bivirkning.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS-byggeprofil'
        required: true
        default: preview
        type: choice
        options: [preview, development, production]

jobs:
  build:
    runs-on: ubuntu-latest
    # Tokenet laeses paa jobniveau, saa alle trin ser det samme.
    #
    # Faldback-kaeden findes fordi et forkert secret-navn ellers giver praecis
    # den samme tomme vaerdi som et manglende: workflows kan ikke opremse
    # secrets, saa hvert navn skal staa eksplicit.
    env:
      EXPO_TOKEN: >-
        ${{ secrets.EXPO_TOKEN || secrets.EXPO_ACCESS_TOKEN || secrets.EAS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Uden tokenet fejler eas-cli med en uigennemskuelig GraphQL-fejl et par
      # minutter senere. Bedre at stoppe her og sige hvad der skal tjekkes.
      - name: Tjek at EXPO_TOKEN findes
        run: |
          # Siger hvilke navne der er sat, uden at afsloere nogen vaerdi.
          # Uden det kan "tom" lige saa godt vaere en fejl i udtrykket ovenfor
          # som en manglende hemmelighed, og de to kraever hver sin rettelse.
          echo "secret EXPO_TOKEN:        ${{ secrets.EXPO_TOKEN != '' }}"
          echo "secret EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN != '' }}"
          echo "secret EAS_TOKEN:         ${{ secrets.EAS_TOKEN != '' }}"
          # "Repository variables" ligger paa den samme side som secrets, lige
          # under dem, og en vaerdi lagt der ser fuldstaendig rigtig ud paa
          # siden. Er den her true og secret'en false, er det hele forklaringen.
          echo "variable EXPO_TOKEN:      ${{ vars.EXPO_TOKEN != '' }}"

          if [ -n "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN er sat (${#EXPO_TOKEN} tegn)"
            exit 0
          fi
          cat <<'HJAELP'
          EXPO_TOKEN er tom. Den skal ligge som *repository secret* under
          Actions. Tjek i denne raekkefoelge — de tre foerste er de hyppigste:

          1. Settings -> Secrets and variables -> Actions.
             Siden har tre faneblade: Actions, Codespaces, Dependabot.
             Kun **Actions** er synlig for workflows. En hemmelighed lagt
             under Codespaces eller Dependabot ser rigtig ud og virker ikke.

          2. "Repository secrets", ikke "Repository variables". De ligger paa
             samme side under hinanden. Linjen "variable EXPO_TOKEN" ovenfor
             siger det: er den true, ligger vaerdien som en variabel.

          3. Navnet. Workflowen accepterer EXPO_TOKEN, EXPO_ACCESS_TOKEN
             eller EAS_TOKEN.

          4. Er den lagt paa et *environment* frem for paa repoet, skal jobbet
             erklaere det environment for at kunne se den.

          Token oprettes paa https://expo.dev/settings/access-tokens
          HJAELP
          exit 1

      - run: npm ci

      # Samme porte som CI. Et build af kode der ikke kan bestaa sine egne
      # tests er spildt byggetid.
      - name: Typecheck og tests
        run: |
          npm run typecheck --workspaces
          npm test --workspaces

      # Verificerer at app.json's indstillinger faktisk lander i manifestet.
      # Det var her usesCleartextTraffic blev laest og aldrig anvendt, og hvor
      # userInterfaceStyle gjorde det samme. Begge fejlede stille.
      #
      # android/ er git-ignoreret (packages/app/.gitignore), og EAS uploader
      # kun sporede filer — mappen naar derfor aldrig builden, uanset at den
      # ligger her paa runneren.
      - name: Verificér AndroidManifest
        working-directory: packages/app
        run: |
          npx expo prebuild --platform android --no-install
          manifest=android/app/src/main/AndroidManifest.xml
          echo "--- $manifest ---"
          cat "$manifest"

          fail=0
          grep -q 'android:usesCleartextTraffic="true"' "$manifest" || {
            echo "::error::usesCleartextTraffic mangler i manifestet." \
                 "Panelet koerer uden TLS, saa appen kan ikke naa det uden den."
            fail=1
          }
          grep -q 'android.permission.INTERNET' "$manifest" || {
            echo "::error::INTERNET-rettigheden mangler i manifestet."
            fail=1
          }
          grep -q "applicationId 'dk.seomidt.norstream'" android/app/build.gradle || {
            echo "::error::applicationId er ikke dk.seomidt.norstream."
            fail=1
          }
          exit $fail

      - name: Byg APK paa EAS
        working-directory: packages/app
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Hvor ligger APK'en
        run: |
          echo "### Build sendt til EAS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Foelg det her, og hent APK'en naar den er faerdig:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://expo.dev/accounts/seomidts-team/projects/iptv-norlys/builds" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Afinstallér den gamle app foerst** — pakkenavnet skiftede ved omdoebningen," >> "$GITHUB_STEP_SUMMARY"
          echo "saa Android ser den nye som en anden app og kan ikke opgradere oven i." >> "$GITHUB_STEP_SUMMARY"
