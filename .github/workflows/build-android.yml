name: Byg Android-APK

# Kun manuelt. Et build koster byggetid, saa det maa ikke fyre af ved hvert
# push — det skal vaere en beslutning, ikke en bivirkning.
on:
  workflow_dispatch:
    inputs:
      motor:
        description: 'Hvor APK-en bygges'
        required: true
        default: runner
        type: choice
        # `runner` bygger med Gradle her paa maskinen og laegger APK-en som en
        # artefakt paa koerslen. Den findes fordi EAS' gratis-plan har et loft
        # per maaned, og da det blev naaet, kunne der ikke bygges en eneste
        # APK — hverken til en rettelse eller til at proeve noget af. Et
        # projekt maa ikke kunne staa stille paa den maade.
        #
        # APK-en signeres med Androids almindelige debug-noegle, som er den
        # samme paa alle maskiner (SHA1 5E:8F:16:06:...). Derfor kan builds
        # herfra opgraderes oven i hinanden. **Den foerste** kan ikke laegges
        # oven i en APK fra EAS: den er signeret med en anden noegle, og
        # Android naegter at opgradere paa tvaers af signaturer.
        # `probe` bygger ingenting: den maaler den adresse der staar i `url`
        # og skriver hvad den svarede. Udviklingsmiljoeet bag appen sidder
        # bag en proxy med en kort liste af tilladte vaerter og kan ikke selv
        # afgoere om brugerens logo-vaert svarer fra internettet — og det
        # spoergsmaal afgoer om 22.071 logoer kan reddes paa én gang.
        options: [runner, eas, probe]
      url:
        description: 'Adresse at maale (kun naar motor er probe)'
        required: false
        type: string
      profile:
        description: 'EAS-byggeprofil (kun naar motor er eas)'
        required: true
        default: preview
        type: choice
        options: [preview, development, production]

jobs:
  build:
    runs-on: ubuntu-latest
    # Tokenet laeses paa jobniveau, saa alle trin ser det samme.
    #
    # Faldback-kaeden findes fordi et forkert secret-navn ellers giver praecis
    # den samme tomme vaerdi som et manglende: workflows kan ikke opremse
    # secrets i en betingelse, saa hvert navn skal staa eksplicit.
    #
    # `EXPO` staar med fordi det er det navn hemmeligheden faktisk har i dette
    # repo. Fire koersler meldte alle tre foerste navne tomme; det var foerst
    # en opremsning af secrets-konteksten der viste hvorfor.
    env:
      EXPO_TOKEN: >-
        ${{ secrets.EXPO_TOKEN || secrets.EXPO_ACCESS_TOKEN || secrets.EAS_TOKEN
        || secrets.EXPO }}
    steps:
      - name: Maal en adresse
        if: inputs.motor == 'probe'
        run: |
          url='${{ inputs.url }}'
          echo "### Maaling af $url" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Hoveder alene foerst; fejler det, en rigtig GET — nogle vaerter
          # afviser HEAD. Ingen af delene henter filen.
          {
            curl -sS -o /dev/null -m 20 -I \
              -w 'HEAD status=%{http_code} type=%{content_type} ip=%{remote_ip} tid=%{time_total}s\n' "$url" \
            || curl -sS -o /dev/null -m 20 \
              -w 'GET  status=%{http_code} type=%{content_type} bytes=%{size_download} ip=%{remote_ip} tid=%{time_total}s\n' "$url"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: inputs.motor != 'probe'

      - uses: actions/setup-node@v5
        if: inputs.motor != 'probe'
        with:
          node-version: 24
          cache: npm

      # Uden tokenet fejler eas-cli med en uigennemskuelig GraphQL-fejl et par
      # minutter senere. Bedre at stoppe her og sige hvad der skal tjekkes.
      - name: Tjek at EXPO_TOKEN findes
        if: inputs.motor == 'eas'
        run: |
          # Siger hvilke navne der er sat, uden at afsloere nogen vaerdi.
          # Uden det kan "tom" lige saa godt vaere en fejl i udtrykket ovenfor
          # som en manglende hemmelighed, og de to kraever hver sin rettelse.
          echo "secret EXPO_TOKEN:        ${{ secrets.EXPO_TOKEN != '' }}"
          echo "secret EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN != '' }}"
          echo "secret EAS_TOKEN:         ${{ secrets.EAS_TOKEN != '' }}"
          echo "secret EXPO:              ${{ secrets.EXPO != '' }}"
          # "Repository variables" ligger paa den samme side som secrets, lige
          # under dem, og en vaerdi lagt der ser fuldstaendig rigtig ud paa
          # siden. Er den her true og secret'en false, er det hele forklaringen.
          echo "variable EXPO_TOKEN:      ${{ vars.EXPO_TOKEN != '' }}"

          if [ -n "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN er sat (${#EXPO_TOKEN} tegn)"
            exit 0
          fi
          cat <<'HJAELP'
          EXPO_TOKEN er tom. Den skal ligge som *repository secret* under
          Actions. Tjek i denne raekkefoelge — de tre foerste er de hyppigste:

          1. Settings -> Secrets and variables -> Actions.
             Siden har tre faneblade: Actions, Codespaces, Dependabot.
             Kun **Actions** er synlig for workflows. En hemmelighed lagt
             under Codespaces eller Dependabot ser rigtig ud og virker ikke.

          2. "Repository secrets", ikke "Repository variables". De ligger paa
             samme side under hinanden. Linjen "variable EXPO_TOKEN" ovenfor
             siger det: er den true, ligger vaerdien som en variabel.

          3. Navnet. Workflowen accepterer EXPO_TOKEN, EXPO_ACCESS_TOKEN,
             EAS_TOKEN eller EXPO. Hedder hemmeligheden noget femte, kan
             navnene opremses med et trin der skriver noeglerne fra
             toJSON(secrets) — kun noegler, aldrig vaerdier.

          4. Er den lagt paa et *environment* frem for paa repoet, skal jobbet
             erklaere det environment for at kunne se den.

          Token oprettes paa https://expo.dev/settings/access-tokens
          HJAELP
          exit 1

      - run: npm ci
        if: inputs.motor != 'probe'

      # Samme porte som CI. Et build af kode der ikke kan bestaa sine egne
      # tests er spildt byggetid.
      - name: Typecheck og tests
        if: inputs.motor != 'probe'
        run: |
          npm run typecheck --workspaces
          npm test --workspaces

      # Verificerer at app.json's indstillinger faktisk lander i manifestet.
      # Det var her usesCleartextTraffic blev laest og aldrig anvendt, og hvor
      # userInterfaceStyle gjorde det samme. Begge fejlede stille.
      #
      # android/ er git-ignoreret (packages/app/.gitignore), og EAS uploader
      # kun sporede filer — mappen naar derfor aldrig builden, uanset at den
      # ligger her paa runneren.
      - name: Verificér AndroidManifest
        if: inputs.motor != 'probe'
        working-directory: packages/app
        run: |
          npx expo prebuild --platform android --no-install
          manifest=android/app/src/main/AndroidManifest.xml
          echo "--- $manifest ---"
          cat "$manifest"

          fail=0
          grep -q 'android:usesCleartextTraffic="true"' "$manifest" || {
            echo "::error::usesCleartextTraffic mangler i manifestet." \
                 "Panelet koerer uden TLS, saa appen kan ikke naa det uden den."
            fail=1
          }
          grep -q 'android.permission.INTERNET' "$manifest" || {
            echo "::error::INTERNET-rettigheden mangler i manifestet."
            fail=1
          }
          grep -q "applicationId 'dk.seomidt.norstream'" android/app/build.gradle || {
            echo "::error::applicationId er ikke dk.seomidt.norstream."
            fail=1
          }
          exit $fail

      # --- Vej 1: byg her paa maskinen ---

      - name: Java til Gradle
        if: inputs.motor == 'runner'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-cache
        if: inputs.motor == 'runner'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Byg APK med Gradle
        if: inputs.motor == 'runner'
        working-directory: packages/app/android
        run: |
          chmod +x gradlew
          # `release` frem for `debug`: en debug-APK forventer en Metro-server
          # i den anden ende og viser en roed skaerm uden. Release-varianten
          # har JavaScript-bundtet med i filen.
          ./gradlew assembleRelease --no-daemon

      - name: Læg APK'en op
        if: inputs.motor == 'runner'
        uses: actions/upload-artifact@v4
        with:
          name: norstream-apk
          path: packages/app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Hvor ligger APK'en (runner)
        if: inputs.motor == 'runner'
        run: |
          {
            echo "### APK'en er bygget her"
            echo ""
            echo "Hent den under **Artifacts** nederst paa denne side:"
            echo "\`norstream-apk\` — pak zip-filen ud, og aabn APK'en paa telefonen."
            echo ""
            echo "**Afinstallér den nuvaerende app foerst.** Den her er signeret med"
            echo "Androids almindelige debug-noegle og ikke med EAS-noeglen, og Android"
            echo "naegter at opgradere paa tvaers af signaturer. Kun den ene gang:"
            echo "senere builds herfra kan laegges oven i hinanden."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Vej 2: byg paa EAS ---

      - name: Byg APK paa EAS
        if: inputs.motor == 'eas'
        working-directory: packages/app
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Hvor ligger APK'en (EAS)
        if: inputs.motor == 'eas'
        run: |
          {
            echo "### Build sendt til EAS"
            echo ""
            echo "Foelg det her, og hent APK'en naar den er faerdig:"
            echo ""
            echo "https://expo.dev/accounts/seomidts-team/projects/iptv-norlys/builds"
          } >> "$GITHUB_STEP_SUMMARY"
