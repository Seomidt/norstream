plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dk.seomidt.norstream'
version = '1.0.0'

android {
  namespace "dk.seomidt.norstream.watchnext"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Googles officielle bibliotek til Android TV's/Google TV's "Fortsaet med at se".
  implementation 'androidx.tvprovider:tvprovider:1.0.0'
}
